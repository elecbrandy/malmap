[project]
name = "malmap"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # ── pipeline ──────────────────────────────────────────
    # 3_embed.py에서 추가 예정: sentence-transformers, umap-learn
    # 5_load.py에서 추가 예정: psycopg[binary]

    # ── backend ───────────────────────────────────────────
    # M2에서 추가 예정: fastapi, uvicorn, psycopg[binary], pgvector
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]