[project]
name = "malmap"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # ── pipeline ──────────────────────────────────────────
    # 3_embed.py: 문장 임베딩 / 4_project.py: UMAP 좌표와 산포도
    # 5_load.py: Supabase(PostgreSQL) 적재
    # ── backend ───────────────────────────────────────────
    # M2에서 추가 예정: fastapi, uvicorn, psycopg[binary], pgvector
    "sentence-transformers>=6.0.1",
    "umap-learn>=0.5.7",
    "matplotlib>=3.10.0",
    "psycopg[binary]>=3.2.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.3.0",
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
pythonpath = ["."]
